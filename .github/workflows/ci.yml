name: EduPulse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Server CI
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Server (TypeScript check)
        working-directory: ./server
        run: npm run build

      # Client CI
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client (Vite + TypeScript check)
        working-directory: ./client
        run: npm run build
